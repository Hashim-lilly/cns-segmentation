# Loss-ablation variant of train_spine_canal.yaml — DiceCE only (weight pair (1,0)).
# Part of docs/phases/phase2.md's 3-way ablation grid (DiceCE-only / clDice-only /
# Combined). Building the mechanism is in scope for Phase 1 (per the Phase 1 plan's
# Decision 3); running this as a training job is optional/deferred — not compute
# committed to yet. See train_spine_canal.yaml for the (1,0.5) "Combined" arm and
# train_spine_canal_ablation_cldiceonly.yaml for the (0,1) arm.
#
# Identical to train_spine_canal.yaml except loss.params and output.experiment_name.

data:
  root_dir: data/spine-generic
  contrast: T2w
  dataset:
    - spine_generic_cord
    - spine_generic_canal

  train_sites:
    - amu
    - balgrist
    - beijingGE
    - beijingPrisma
    - beijingVerio
    - brnoCeitec
    - brnoUhb
    - cmrra
    - cmrrb
    - dresden
    - fslAchieva
    - fslPrisma
    - hamburg
    - mgh
    - milan
    - mniPilot
    - mniS
    - mountSinai
    - mpicbs
    - nottwil
    - nwu
    - oxfordFmrib
    - oxfordOhba
    - pavia
    - perform
    - queensland
    - sherbrooke
    - strasbourg
    - tokyoIngenia
    - tokyoSkyra
    - ucl
    - vallHebron
    - vuiisAchieva
    - vuiisIngenia
  val_sites:
    - barcelona
    - cardiff
    - geneva
    - stanford
    - tehranS
    - ubc
    - ucdavis
    - unf

  min_file_size: 1000

model:
  architecture: SegResNet
  spatial_dims: 3
  in_channels: 1
  out_channels: 3
  init_filters: 32
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]
  dropout_prob: 0.2

training:
  patch_size: [48, 160, 160]
  batch_size: 2
  num_samples: 4
  pos_neg_ratio: 2
  epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-6

  # Ablation arm: DiceCE only (weight pair (1,0))
  loss:
    name: CombinedLoss
    params:
      dice_ce_weight: 1.0
      cldice_weight: 0.0
      cldice_iter: 3

  augmentation:
    rand_flip_prob: 0.5
    rand_flip_axes: [1, 2]
    rand_rotate90_prob: 0.3
    rand_rotate90_axes: [1, 2]
    rand_gaussian_noise_prob: 0.2
    rand_gaussian_noise_std: 0.05
    rand_adjust_contrast_prob: 0.2
    rand_adjust_contrast_gamma: [0.7, 1.5]
    rand_bias_field_prob: 0.2
    rand_bias_field_coeff_range: [0.0, 0.3]
    rand_gaussian_smooth_prob: 0.2
    rand_gaussian_smooth_sigma: [0.25, 1.5]
    rand_scale_intensity_prob: 0.2
    rand_scale_intensity_factors: 0.1
    rand_shift_intensity_prob: 0.2
    rand_shift_intensity_offsets: 0.1

  val_interval: 5
  sliding_window:
    roi_size: [48, 160, 160]
    overlap: 0.5
    mode: gaussian

  save_best: true
  metric_for_best: val_dice
  early_stopping:
    patience: 20
    min_delta: 0.001

preprocessing:
  orientation: RAS
  spacing: [1.0, 0.5, 0.5]
  normalize: true
  nonzero_norm: true

output:
  experiment_dir: experiments
  experiment_name: spine_segresnet_canal_ablation_diceonly
  mlflow_tracking_uri: experiments/mlruns

device: auto
seed: 42
num_workers: 4

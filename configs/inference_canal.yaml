# Inference configuration for the canal multi-class model (bg + cord + canal)
# Pair with: configs/train_spine_canal.yaml
#   python scripts/predict.py --config configs/inference_canal.yaml --train-config configs/train_spine_canal.yaml

model:
  checkpoint: experiments/spine_segresnet_canal/checkpoints/best_model.pth
  architecture: SegResNet
  spatial_dims: 3
  in_channels: 1
  out_channels: 3  # background + cord + canal
  init_filters: 32
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]
  dropout_prob: 0.2

inference:
  sliding_window:
    roi_size: [48, 160, 160]
    overlap: 0.5
    mode: gaussian

  # Post-processing
  threshold: 0.5
  keep_largest_component: true

  # MC-Dropout uncertainty (Phase 3)
  uncertainty:
    enabled: false  # set true in Phase 3
    n_samples: 8
    metrics:
      - predictive_entropy
      - mutual_information
      - variance

preprocessing:
  orientation: RAS
  spacing: [1.0, 0.5, 0.5]
  normalize: true
  nonzero_norm: true

mesh:
  enabled: true
  smooth_iterations: 5
  smooth_lambda: 0.5
  decimate_target: null  # set to reduce face count if needed
  output_format: stl

output:
  save_predictions: true
  save_uncertainty: true
  save_mesh: true
  output_dir: experiments/predictions_canal

device: auto

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-segmentation"
version = "0.1.0"
description = "CNS spinal cord segmentation pipeline for CFD mesh generation"
requires-python = ">=3.10"
license = {text = "Proprietary - Eli Lilly"}
authors = [{name = "CNS Drug Delivery Team"}]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "monai>=1.3,<1.5",
    "nibabel>=5.0",
    "SimpleITK>=2.3",
    "scikit-image>=0.21",
    "trimesh>=4.0",
    "pymeshlab>=2023.12",
    "mlflow>=2.10",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
viz = [
    "napari>=0.4",
]
topo = [
    "gudhi>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
